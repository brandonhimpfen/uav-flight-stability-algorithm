[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-flight-stability"
version = "1.0.0"
description = "Explainable adaptive anomaly scoring for UAV flight stability telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Brandon Himpfen" }
]
keywords = ["uav", "drone", "telemetry", "anomaly-detection", "flight-stability", "aviation", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[project.scripts]
uav-stability = "uav_stability.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uav_stability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
